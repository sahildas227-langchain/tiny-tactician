[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "tiny-tactician"
dynamic = ["version"]
description = "A 360M-parameter Othello master that runs entirely on your own machine"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE.md", "NOTICE"]
keywords = ["othello", "reversi", "board-game", "on-device", "llama.cpp", "mcts"]
authors = [
    {name = "TinyTactician contributors"},
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Games/Entertainment :: Board Games",
]

# The agent engine is pure Python (no third-party runtime dependencies).
# The language model runs through the locally installed `llama` binary.
dependencies = [
    "rich",
    "typer",
    "prompt_toolkit",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "huggingface_hub",
]

[project.urls]
Homepage = "https://github.com/sunburnedasian/tiny-tactician"
Repository = "https://github.com/sunburnedasian/tiny-tactician"

[project.scripts]
tiny-tactician = "tiny_tactician.run.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "tiny_tactician.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tiny_tactician*"]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 120
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "PLE",
    "E713",
    "E714",
    "E711",
    "F821",
    "F822",
    "F401",
    "F841",
    "F541",
    "F901",
    "I001",
    "I002",
    "UP",
    "C401",
    "C402",
    "C403",
    "C404",
    "C405",
    "F632",
    "W605",
    "B006",
    "B007",
    "B009",
    "EM",
    "RET",
    "RUF019",
    "PT",
    "SIM201",
    "PTH100",
    "PTH110",
    "PTH111",
    "PTH112",
    "PTH113",
    "PTH114",
    "PTH117",
    "PTH118",
    "PTH119",
    "PTH120",
    "PTH121",
    "PTH122",
    "PTH202",
    "PTH203",
    "PTH204",
    "PTH205",
]
ignore = [
    "RET505",
    "RET506",
    "RET507",
    "E501",
    "E402",
    "E722",
    "E741",
    "PT011",
    "PT018",
    "EM101",
    "EM102",
    "EM103",
]

fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-k \"not slow\"')",
]
